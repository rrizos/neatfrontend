# neatapp.gr serves three things from one origin, so a shared post link
# (https://neatapp.gr/post/123) previews and opens without an `app.` hop:
#
#   /                 → the marketing landing page   (landing/index.html)
#   /privacy, /terms  → the legal pages              (landing/*.html)
#   everything else   → the Flutter web app          (app.html + build assets)
#
# The publish directory is assembled by tools/build_web.sh.

[build]
  publish = "build/netlify"
  edge_functions = "netlify/edge-functions"

[[edge_functions]]
  path = "/post/:id/og-image"
  function = "og-image"

[[edge_functions]]
  path = "/post/:id"
  function = "post-meta"

[[redirects]]
  from = "/api/*"
  to = "http://63.181.201.175/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "http://63.181.201.175/media/:splat"
  status = 200
  force = true

# Apple fetches this with no Accept header and requires JSON, but the file is
# extensionless so Netlify would guess text/plain.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# SPA fallback: /app, /post/:id and every other in-app route load the Flutter
# shell. `/` is not caught by this — index.html (the landing page) is a real
# file, and Netlify serves matching files before applying rewrites.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200
